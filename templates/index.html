<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 관리</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>📝 할 일 관리</h1>

    <form class="add-form" action="{{ url_for('add') }}" method="post">
        <input type="text" name="title" placeholder="할 일을 입력하세요" autofocus required>
        <button type="submit">추가</button>
    </form>

    <p class="summary">
        {% if todos %}
            총 {{ todos|length }}개 중 {{ remaining }}개 남음
        {% else %}
            등록된 할 일이 없습니다.
        {% endif %}
    </p>

    <ul class="todo-list">
        {% for todo in todos %}
        <li class="{{ 'done' if todo.done else '' }}">
            <form action="{{ url_for('toggle', todo_id=todo.id) }}" method="post" class="toggle-form">
                <button type="submit" class="check-btn">
                    {{ '✅' if todo.done else '⬜' }}
                </button>
            </form>
            <span class="title">{{ todo.title }}</span>
            <form action="{{ url_for('delete', todo_id=todo.id) }}" method="post" class="delete-form">
                <button type="submit" class="delete-btn">삭제</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
